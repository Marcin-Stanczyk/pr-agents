# Fixer — started BY HAND, after you have read the review.
#
# Two ways to ask, both human events, so they trigger normally (GitHub's
# no-cascade guard only applies to events caused by `GITHUB_TOKEN`):
#
#   LABEL — "apply everything from the review"
#     ai:fix       → Sonnet
#     ai:fix-opus  → Opus
#
#   COMMENT — "fix exactly this"
#     @claude fix points 1 and 3, ignore point 2 — it is wrong   → Sonnet
#     @claude-opus rewrite the validation from point 4           → Opus
#
# The label is removed once the run starts, so it can be clicked a second time.
#
# This agent pushes with the default token, so it will NOT re-trigger the review.
# When you want a fresh opinion, apply `ai:review`. There is no loop by design:
# every round costs, so every round is your decision.

name: Claude — fix after review

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: claude-fix-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Without this the action fails with "Could not fetch an OIDC token".
  id-token: write

jobs:
  fix:
    # Comments: owner and collaborators only. Without this check, text written by
    # an outsider would be steering an agent that has write access.
    # Comments on plain issues are skipped — `issue.pull_request` exists only when
    # the comment is on a pull request.
    if: |
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["ai:fix","ai:fix-opus"]'), github.event.label.name)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR, branch and model
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            num="${{ github.event.pull_request.number }}"
            branch="${{ github.event.pull_request.head.ref }}"
            origin_repo="${{ github.event.pull_request.head.repo.full_name }}"
            case "${{ github.event.label.name }}" in
              ai:fix-opus) model="claude-opus-5"  ;;
              *)           model="claude-sonnet-5" ;;
            esac
            brief="Apply every point from the latest review."
          else
            num="${{ github.event.issue.number }}"
            # issue_comment carries no PR data — it has to be fetched.
            read -r branch origin_repo < <(gh pr view "$num" --repo "${{ github.repository }}" \
              --json headRefName,headRepository \
              -q '"\(.headRefName) \(.headRepository.name)"')
            origin_repo="${{ github.repository_owner }}/$origin_repo"
            if [[ "${{ github.event.comment.body }}" == @claude-opus* ]]; then
              model="claude-opus-5"
            else
              model="claude-sonnet-5"
            fi
            brief="Do exactly what the human asks for in the comment."
          fi

          # PR from a fork: the default token is read-only there, so a push would
          # fail anyway. Stop early with a clear reason.
          if [ "$origin_repo" != "${{ github.repository }}" ]; then
            echo "PR comes from a fork ($origin_repo) — the agent has no write access there." >&2
            exit 1
          fi

          {
            echo "num=$num"
            echo "branch=$branch"
            echo "model=$model"
            echo "brief=$brief"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.branch }}

      - name: Fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # No spaces inside --allowedTools, or the whole list arrives empty.
          claude_args: |
            --model ${{ steps.target.outputs.model }}
            --max-turns 40
            --allowedTools Read,Glob,Grep,Write,Edit,Bash(git:*)
          prompt: |
            You are working on PR #${{ steps.target.outputs.num }},
            branch `${{ steps.target.outputs.branch }}`.

            ${{ steps.target.outputs.brief }}
            Read the PR comments: the agent's review and — if there is one — the
            comment from the human who asked for this fix. **The human's
            instruction outranks the review.** If they said to ignore something,
            ignore it.

            Rules with no exceptions:
            - Fix only what was pointed out. No refactoring on the side, no new
              abstractions, no handling for cases that cannot occur.
            - Never `git add -A` or `git commit -a` — always explicit paths.
            - Never rewrite history: no `rebase`, `commit --amend`, `push --force`.
            - If you believe a finding is wrong, do NOT change the code — reply in
              a comment explaining why and leave the decision to the human.
            - Delete `.agent-verdict`, `.agent-review.md` and `.agent-notes.json`
              if the review left them behind.

            Commit and push to `${{ steps.target.outputs.branch }}`.
            Commit message: `fix(review): <what was fixed>`.

            Finish with a short comment: what you fixed, what you deliberately
            left alone and why. Remind the reader that a fresh review is the
            `ai:review` label.

      - name: Drop the label so it can be clicked again
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.num }}/labels/${{ github.event.label.name }}" \
            2>/dev/null || true
